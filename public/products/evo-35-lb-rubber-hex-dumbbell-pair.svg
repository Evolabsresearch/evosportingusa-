  </defs>
  <rect width="1200" height="1200" rx="54" fill="url(#bg)"/>
  <circle cx="960" cy="220" r="128" fill="#22d3ee" opacity=".14"/>
  <circle cx="220" cy="950" r="190" fill="#164e63" opacity=".08"/>
