        <rect x="430" y="520" width="340" height="160" rx="70" fill="#22d3ee"/>
        <rect x="210" y="505" width="90" height="190" rx="24" fill="#164e63"/>
        <rect x="900" y="505" width="90" height="190" rx="24" fill="#164e63"/>
